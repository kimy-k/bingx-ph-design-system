<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Safety Card · 01 Fake Support DMs · 1200×630</title>
<link rel="stylesheet" href="../../../colors_and_type.css">
<link rel="stylesheet" href="../_framework/styles.css">
<style>
  :root { --canvas-w: 1200px; --canvas-h: 630px; --preview-scale: 0.6; }
  .card-export { width: 1200px; height: 630px; padding: 64px 64px 48px; }
  /* Icon left, copy right */
  .warn-icon { position: absolute; top: 50%; left: 80px; transform: translateY(-50%); font-size: 220px; }
  .copy { position: absolute; top: 56px; left: 420px; right: 64px; bottom: 48px; display: flex; flex-direction: column; }
  .series-label { font-size: 18px; padding: 8px 16px; margin-bottom: 18px; white-space: nowrap; }
  .headline { font-size: 72px; margin-bottom: 18px; }
  .body-text { font-size: 24px; margin-bottom: 18px; }
  .safe-rule { padding: 18px 22px; }
  .safe-rule .tag { font-size: 15px; }
  .safe-rule .line { font-size: 22px; font-weight: 600; margin-top: 6px; line-height: 1.3; }
  .risk { position: absolute; bottom: 22px; left: 420px; right: 260px; font-size: 14px; }
  .watermark { bottom: 20px; right: 24px; height: 22px; }
</style>
</head>
<body class="preview-mode">
  <div class="card-export danger">
    <div class="top-strip"></div>
    <div class="hazard"></div>

    <div class="warn-icon">🚩</div>

    <div class="copy">
      <div class="series-label">⚠️ RED FLAG</div>
      <h1 class="headline">Fake <span class="accent">Support</span> DMs</h1>
      <p class="body-text">DMs claiming to be <span class="accent">BingX support</span> on Telegram, FB, o Viber? Scam yan.</p>
      <div class="safe-rule">
        <div class="tag">✓ Safe rule</div>
        <div class="line">Official BingX support is <strong>in-app only</strong>.</div>
      </div>
    </div>

    <div class="risk">Crypto trading is risky. Use money you can afford to lose.</div>
    <img class="watermark" src="../../../assets/logos/bingx-wordmark-white.svg" alt="BingX">
  </div>
</body>
</html>
