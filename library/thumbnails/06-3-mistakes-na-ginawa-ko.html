<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BingX PH — Thumbnail 06 · 3 Mistakes na Ginawa Ko</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="_framework/styles.css">
<script src="_framework/image-slot.js"></script>
<style>
  /* PER-THUMB OVERRIDE: warning-intent subhead.
     Only Text-Heavy thumbnail with a non-brand-blue subhead — the
     red signals urgency BEFORE viewer clicks (confession/warning hook). */
  .thumb-text-heavy .subhead.warning {
    color: var(--accent-loss);
  }
</style>
</head>
<body class="preview-mode">
  <div class="thumb-1280 thumb-text-heavy">
    <div class="text-zone">
      <h1 class="headline">3 <span class="hl">mistakes</span> na ginawa ko</h1>
      <div class="subhead warning">Wag mo itong gawin</div>
    </div>
    <div class="image-zone">
      <image-slot
        id="thumb-06-mistakes"
        shape="rect"
        fit="cover"
        placeholder="DROP YOUR DISAPPOINTED FACE"></image-slot>
    </div>
    <img class="watermark-thumb" src="../../assets/logos/bingx-wordmark-white.svg" alt="BingX">
  </div>
</body>
</html>
