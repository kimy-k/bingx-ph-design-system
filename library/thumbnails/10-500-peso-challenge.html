<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BingX PH — Thumbnail 10 · ₱500 Challenge</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="_framework/styles.css">
<script src="_framework/image-slot.js"></script>
</head>
<body class="preview-mode">
  <div class="thumb-1280 thumb-numbers">
    <div class="thumb-badge hot">🔥 CHALLENGE</div>

    <div class="image-zone">
      <image-slot
        id="thumb-10-500-challenge"
        shape="rect"
        fit="cover"
        placeholder="DROP YOUR COIN STACK OR HAND HOLDING ₱500"></image-slot>
    </div>
    <div class="number-zone">
      <div class="big-number">₱500</div>
      <div class="number-caption">Can ₱500 turn<br>into <span class="hl-profit">₱5,000</span>?</div>
    </div>

    <img class="watermark-thumb" src="../../assets/logos/bingx-wordmark-white.svg" alt="BingX">
  </div>
</body>
</html>
