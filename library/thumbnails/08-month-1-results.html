<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BingX PH — Thumbnail 08 · Month 1 Results</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="_framework/styles.css">
<script src="_framework/image-slot.js"></script>
<style>
  /* PER-THUMB: hero-md + caption-below needs taller number-zone to

  .thumb-1280 { grid-template-rows: 55% 45%; }
</style>
</head>
<body class="preview-mode">
  <div class="thumb-1280 thumb-numbers">
    <div class="thumb-badge results">RESULTS</div>

    <div class="image-zone">
      <image-slot
        id="thumb-08-month-1"
        shape="rect"
        fit="cover"
        placeholder="DROP YOUR MONTH 1 PNL SCREENSHOT"></image-slot>
    </div>
    <div class="number-zone caption-below">
      <div class="big-number hero-md">MONTH 1</div>
      <div class="number-caption">First 30 days copy trading sa <span class="hl">BingX</span></div>
    </div>

    <img class="watermark-thumb" src="../../assets/logos/bingx-wordmark-white.svg" alt="BingX">
  </div>

</html>
