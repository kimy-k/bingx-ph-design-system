<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BingX PH — Thumbnail Base C · Numbers-Focused</title>
<link rel="stylesheet" href="../../../colors_and_type.css">
<link rel="stylesheet" href="styles.css">
<script src="image-slot.js"></script>
</head>
<body class="preview-mode">
  <div class="thumb-1280 thumb-numbers">
    <div class="thumb-badge results">RESULTS</div>

    <div class="image-zone">
      <image-slot
        id="thumb-base-numbers"
        shape="rect"
        fit="cover"
        placeholder="DROP PROFIT SCREENSHOT OR CHART"></image-slot>
    </div>
    <div class="number-zone">
      <div class="big-number">₱5,000</div>
      <div class="number-caption">in <span class="hl">7 days</span><br>Copy Trading</div>
    </div>

    <img class="watermark-thumb" src="../../../assets/logos/bingx-wordmark-white.svg" alt="BingX">
  </div>
</body>
</html>
