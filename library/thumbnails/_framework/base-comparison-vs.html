<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BingX PH — Thumbnail Base B · Comparison VS</title>
<link rel="stylesheet" href="../../../colors_and_type.css">
<link rel="stylesheet" href="styles.css">
<script src="image-slot.js"></script>
</head>
<body class="preview-mode">
  <div class="thumb-1280 thumb-vs">
    <div class="vs-side">
      <image-slot
        id="thumb-base-vs-left"
        shape="rect"
        fit="cover"
        placeholder="DROP LEFT PHOTO"></image-slot>
      <div class="vs-label">BingX</div>
    </div>
    <div class="vs-side">
      <image-slot
        id="thumb-base-vs-right"
        shape="rect"
        fit="cover"
        placeholder="DROP RIGHT PHOTO"></image-slot>
      <div class="vs-label">Binance</div>
    </div>
    <div class="vs-divider"></div>
    <div class="vs-badge">VS</div>

    <img class="watermark-thumb" src="../../../assets/logos/bingx-wordmark-white.svg" alt="BingX">
  </div>
</body>
</html>
