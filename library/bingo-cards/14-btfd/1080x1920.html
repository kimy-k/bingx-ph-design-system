<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bingo Card · 01 HODL · 1080×1920</title>
<link rel="stylesheet" href="../../../colors_and_type.css">
<link rel="stylesheet" href="../_framework/styles.css">
<style>
  :root { --canvas-w: 1080px; --canvas-h: 1920px; --preview-scale: 0.32; }
  .card-export { width: 1080px; height: 1920px; padding: 200px 96px 160px; display: flex; flex-direction: column; align-items: center; }

  .category-badge { font-size: 32px; padding: 16px 32px; }

  .term {
    font-size: 180px;
    margin: 48px 0 40px;
    text-align: center;
  }

  .bingo-zone {
    position: relative;
    width: 100%;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }
  .bingo-glow { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 900px; height: 900px; }
  .bingo {
    position: relative;
    width: 720px; height: 720px;
    top: auto; left: auto; transform: none;
  }

  .definition {
    font-size: 40px;
    text-align: center;
    max-width: 90%;
    margin: 0 auto;
  }

  .cta-cue {
    position: absolute;
    bottom: 200px;
    left: 0; right: 0;
    text-align: center;
    font-size: 28px;
    font-weight: 600;
    color: #9CA3AF;
  }
  .cta-cue .accent { color: var(--accent); font-weight: 700; }

  .risk {
    position: absolute;
    bottom: 92px; left: 0; right: 0;
    text-align: center;
    font-size: 22px;
    padding: 0 96px;
  }

  .watermark {
    bottom: 36px;
    right: 50%;
    transform: translateX(50%);
    height: 36px;
    opacity: 0.6;
  }
</style>
</head>
<body class="preview-mode">
  <div class="card-export trading">
    <div class="top-strip"></div>

    <div class="category-badge">📊 Trading</div>

    <h1 class="term" style="font-size: 180px;">BTFD</h1>

    <div class="bingo-zone">
      <div class="bingo-glow"></div>
      <img class="bingo" src="../../../assets/bingo/14_btfd.png" alt="Bingo BTFD">
    </div>

    <p class="definition"><span class="accent">Buy The F***ing Dip</span>. Aggressive version ng Buy The Dip.</p>

    <div class="cta-cue">👆 <span class="accent">Tap link in bio</span> to learn more terms</div>

    <div class="risk">Crypto trading is risky. Use money you can afford to lose.</div>
    <img class="watermark" src="../../../assets/logos/bingx-wordmark-white.svg" alt="BingX">
  </div>
</body>
</html>
