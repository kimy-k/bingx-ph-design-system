<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BingX PH — Campaign Base E · Referral Push</title>
<link rel="stylesheet" href="../../../colors_and_type.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="preview-mode sq editable-mode">
  <div class="campaign-canvas sq campaign-referral">
    <div class="brand-strip-top"></div>
    <div class="edit-mode-badge">⚙ EDIT MODE</div>

    <div class="category-tag" style="margin-top: 12px;">REFER A FRIEND</div>

    <h1 class="hero">
      <span class="edit-slot" data-slot="hero">Both of you earn — both ways</span>
    </h1>

    <div class="split-row">
      <div class="split-side">
        <div class="split-label">You earn</div>
        <div class="split-amount"><span class="edit-slot" data-slot="amount-you">₱500</span></div>
      </div>
      <div class="split-divider">+</div>
      <div class="split-side">
        <div class="split-label">They earn</div>
        <div class="split-amount"><span class="edit-slot" data-slot="amount-friend">₱500</span></div>
      </div>
    </div>

    <ol class="steps">
      <li><span class="edit-slot" data-slot="step-1">Share your link via DM, chat, or post</span></li>
      <li><span class="edit-slot" data-slot="step-2">Friend signs up + completes first trade</span></li>
      <li><span class="edit-slot" data-slot="step-3">Both get ₱500 credited to GCash</span></li>
    </ol>

    <div class="cta-footer" style="position: absolute; bottom: 120px; left: 88px; right: 88px; display: flex; align-items: center; gap: 20px;">
      <span class="cta-button">Send My Link</span>
      <span style="font-size: 22px; font-weight: 600; color: var(--text-secondary);">[REFERRAL_LINK]</span>
    </div>

    <img class="watermark" src="../../../assets/logos/bingx-wordmark-white.svg" alt="BingX">
  </div>
</body>
</html>
