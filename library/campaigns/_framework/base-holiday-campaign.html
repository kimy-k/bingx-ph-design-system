<!DOCTYPE html>
<html lang="en">
<head>

<body class="preview-mode sq editable-mode">

    <div class="edit-mode-badge">⚙ EDIT MODE</div>

    <div class="category-tag" style="margin-top: 12px;">
      <span class="edit-slot" data-slot="holiday-name">PASKO 2026</span>

      <span class="edit-slot" data-slot="greeting">Maligayang Pasko, ka-BingX!</span>

    <div class="promo-line">
      <span class="edit-slot" data-slot="promo-line">₱500 BONUS FOR PASKO</span>

    <p class="body">

    </p>

    <div class="cta-footer" style="position: absolute; bottom: 120px; left: 88px; right: 88px; display: flex; align-items: center; gap: 20px;">
      <span class="cta-button">Claim Holiday Bonus</span>
      <span style="font-size: 22px; font-weight: 600; color: var(--text-secondary);">[REFERRAL_LINK]</span>
    </div>

    <img class="watermark" src="../../../assets/logos/bingx-wordmark-white.svg" alt="BingX">
