<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BingX PH — Campaign Base B · Competition Card</title>
<link rel="stylesheet" href="../../../colors_and_type.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="preview-mode pt editable-mode">
  <div class="campaign-canvas pt campaign-competition">
    <div class="brand-strip-top"></div>
    <div class="edit-mode-badge">⚙ EDIT MODE</div>

    <div class="category-tag" style="margin-top: 12px;">
      <span class="edit-slot" data-slot="campaign-type">TRADING COMPETITION</span>
    </div>

    <h1 class="comp-name">
      <span class="edit-slot" data-slot="comp-name">Top Copy Trader of the Month</span>
    </h1>

    <div class="tiers">
      <div class="tier gold">
        <div class="tier-rank">1st Place</div>
        <div class="tier-prize"><span class="edit-slot" data-slot="prize-1">₱10,000</span></div>
      </div>
      <div class="tier silver">
        <div class="tier-rank">2nd Place</div>
        <div class="tier-prize"><span class="edit-slot" data-slot="prize-2">₱5,000</span></div>
      </div>
      <div class="tier bronze">
        <div class="tier-rank">3rd Place</div>
        <div class="tier-prize"><span class="edit-slot" data-slot="prize-3">₱2,500</span></div>
      </div>
    </div>

    <ol class="mechanics-list">
      <li><span class="edit-slot" data-slot="step-1">Sign up at BingX via [REFERRAL_LINK]</span></li>
      <li><span class="edit-slot" data-slot="step-2">Start Copy Trading any verified trader</span></li>
      <li><span class="edit-slot" data-slot="step-3">Top 3 highest ROI by month-end win prizes</span></li>
    </ol>

    <div class="deadline-banner">
      <span class="edit-slot" data-slot="deadline">ENDS DEC 31 · 5 DAYS LEFT</span>
    </div>

    <img class="watermark" src="../../../assets/logos/bingx-wordmark-white.svg" alt="BingX">
  </div>
</body>
</html>
