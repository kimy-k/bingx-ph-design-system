<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BingX PH — Campaign Base A · Bonus Banner</title>
<link rel="stylesheet" href="../../../colors_and_type.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="preview-mode sq editable-mode">
  <div class="campaign-canvas sq campaign-bonus">
    <div class="brand-strip-top"></div>
    <div class="edit-mode-badge">⚙ EDIT MODE</div>

    <div class="category-tag" style="margin-top: 12px;">
      <span class="edit-slot" data-slot="campaign-type">DEPOSIT BONUS</span>
    </div>

    <div class="hero-amount">
      <span class="edit-slot" data-slot="prize-amount">₱5,000</span>
    </div>

    <p class="mechanics">
      <span class="edit-slot block" data-slot="mechanics">Deposit ₱500+, claim 100% bonus on first trade.</span>
    </p>

    <div class="deadline">
      <span class="end-date edit-slot" data-slot="end-date">ENDS DEC 31</span>
      <span class="days-left edit-slot" data-slot="days-left">5 DAYS LEFT</span>
    </div>

    <div class="cta-footer">
      <span class="cta-button">Claim Bonus</span>
      <span class="cta-link-text">[REFERRAL_LINK]</span>
    </div>

    <img class="watermark" src="../../../assets/logos/bingx-wordmark-white.svg" alt="BingX">
  </div>
</body>
</html>
